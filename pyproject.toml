[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "rulecheck-ar"
version = "0.1.0"
description = "Arabic-first open test suite and CLI for checking LLM safety rules (refusals and over-refusals)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Akram Almaliky" }]
keywords = ["llm", "safety", "evaluation", "arabic", "testing"]
dependencies = ["pyyaml"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
rulecheck-ar = "rulecheck_ar.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rulecheck_ar = ["data/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
